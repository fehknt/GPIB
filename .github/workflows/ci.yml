name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    # -A Win32 is required: the toolkit is 32-bit (x86 inline __asm in
    # waterfall.cpp, and the vendored winvfx16/w32sal/sh_api/agvisa libs are
    # x86).  Without it the VS generator defaults to x64 and the build fails.
    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -S ${{github.workspace}} -A Win32

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config Release

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C Release --output-on-failure
